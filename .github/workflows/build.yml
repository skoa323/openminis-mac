name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: swift test

      - name: Build & package
        run: |
          chmod +x scripts/bundle.sh
          scripts/bundle.sh "0.1.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-dmg
          path: dist/*.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" dist/*.dmg \
            --title "OpenMinis for Mac $TAG" \
            --notes "Unsigned build from ${{ github.sha }}. First launch: right-click → Open, or run: xattr -cr /Applications/OpenMinis.app"
